<svg width="1100" height="620" viewBox="0 0 1100 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ZiggyZag split panes</title>
  <desc id="desc">A terminal window with three PTY-backed panes — two on the left stacked vertically and one tall pane on the right — each running an independent shell.</desc>
  <defs>
    <linearGradient id="split-bg" x1="0" y1="0" x2="1100" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c0e11"/>
      <stop offset="1" stop-color="#15181b"/>
    </linearGradient>
    <linearGradient id="split-accent" x1="0" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7a41d"/>
      <stop offset="0.5" stop-color="#35d0ba"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="split-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="14" in="SourceAlpha"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="split-p1"><rect x="76" y="160" width="500" height="194" rx="6"/></clipPath>
    <clipPath id="split-p2"><rect x="76" y="362" width="500" height="194" rx="6"/></clipPath>
    <clipPath id="split-p3"><rect x="584" y="160" width="440" height="396" rx="6"/></clipPath>
  </defs>

  <rect width="1100" height="620" fill="url(#split-bg)"/>

  <!-- Brand corner mark -->
  <g transform="translate(60 36) scale(0.12)" opacity="0.95">
    <rect x="42" y="54" width="428" height="404" rx="38" fill="#191c1d" stroke="#2b3447" stroke-width="12"/>
    <path d="M138 180H354L228 296H366L366 336H150L276 220H138V180Z" fill="url(#split-accent)"/>
  </g>
  <text x="120" y="80" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#eef2e2" letter-spacing="-0.5">ZiggyZag · Split panes</text>
  <text x="120" y="102" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#6a7072">Three real PTYs · Ctrl+Shift+D · Ctrl+Shift+E · Ctrl+Shift+N · Ctrl+Shift+W</text>

  <!-- Outer window -->
  <rect x="60" y="120" width="980" height="440" rx="14" fill="#111315" stroke="#2b3447" stroke-width="1" filter="url(#split-shadow)"/>
  <rect x="60" y="120" width="980" height="40" rx="14" fill="#191c1d"/>
  <rect x="60" y="148" width="980" height="12" fill="#191c1d"/>
  <circle cx="86" cy="140" r="6" fill="#ff6b6b"/>
  <circle cx="106" cy="140" r="6" fill="#ffd166"/>
  <circle cx="126" cy="140" r="6" fill="#35d0ba"/>
  <text x="540" y="145" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#6a7072">ziggyzag — split layout · 3 panes · catppuccin-mocha</text>

  <!-- Pane separators -->
  <line x1="580" y1="160" x2="580" y2="556" stroke="#2b3447" stroke-width="1"/>
  <line x1="76" y1="358" x2="576" y2="358" stroke="#2b3447" stroke-width="1"/>

  <!-- =========== Pane 1 (top-left) =========== -->
  <g clip-path="url(#split-p1)">
    <rect x="76" y="160" width="500" height="194" fill="#1e1e2e"/>
    <g font-family="'Cascadia Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13">
      <text x="92" y="186" fill="#a6e3a1">~/dev/ZiggyZag</text>
      <text x="92" y="206" fill="#cdd6f4">❯ zig build test</text>
      <text x="92" y="226" fill="#a6e3a1">All 197 tests passed</text>
      <text x="92" y="246" fill="#89b4fa">test "TSV field escape and unescape" ✓</text>
      <text x="92" y="262" fill="#89b4fa">test "JSON encoder escapes sub-0x20" ✓</text>
      <text x="92" y="278" fill="#89b4fa">test "theme registry contains 20 themes" ✓</text>
      <text x="92" y="294" fill="#89b4fa">test "WCAG contrast audit covers themes" ✓</text>
      <text x="92" y="320" fill="#a6e3a1">~/dev/ZiggyZag</text>
      <text x="92" y="340" fill="#cdd6f4">❯ <tspan fill="#f5e0dc">█</tspan></text>
    </g>
  </g>
  <text x="92" y="178" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#a6e3a1" letter-spacing="0.4">PANE 1 · ACTIVE</text>
  <rect x="76" y="160" width="500" height="194" rx="6" fill="none" stroke="#a6e3a1" stroke-width="2"/>

  <!-- =========== Pane 2 (bottom-left) =========== -->
  <g clip-path="url(#split-p2)">
    <rect x="76" y="362" width="500" height="194" fill="#1e1e2e"/>
    <g font-family="'Cascadia Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13">
      <text x="92" y="388" fill="#a6e3a1">~/dev/ZiggyZag/docs</text>
      <text x="92" y="408" fill="#cdd6f4">❯ history --slow 100 --cwd</text>
      <text x="92" y="428" fill="#a9b1d6">3m22s  zig build -Doptimize=ReleaseSafe</text>
      <text x="92" y="444" fill="#a9b1d6">2m08s  scripts/qa-release-artifacts.ps1</text>
      <text x="92" y="460" fill="#a9b1d6">1m54s  zig build test</text>
      <text x="92" y="476" fill="#a9b1d6">  41s  rg "ZIGGYZAG_THEME" --line-number</text>
      <text x="92" y="492" fill="#a9b1d6">  31s  python scripts/audit_contrast.py</text>
      <text x="92" y="512" fill="#a6e3a1">~/dev/ZiggyZag/docs</text>
      <text x="92" y="532" fill="#cdd6f4">❯</text>
    </g>
  </g>
  <text x="92" y="380" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#6c6f85" letter-spacing="0.4">PANE 2</text>

  <!-- =========== Pane 3 (right) =========== -->
  <g clip-path="url(#split-p3)">
    <rect x="584" y="160" width="440" height="396" fill="#1e1e2e"/>
    <g font-family="'Cascadia Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13">
      <text x="600" y="186" fill="#a6e3a1">~/dev/ZiggyZag/apps/agentd</text>
      <text x="600" y="206" fill="#cdd6f4">❯ ./zig-out/bin/ziggyzag-agentd --stdio</text>
      <text x="600" y="226" fill="#94e2d5">listening on stdio</text>
      <text x="600" y="252" fill="#cdd6f4">{"id":1,"method":"agent/health"}</text>
      <text x="600" y="272" fill="#a9b1d6">{"id":1,"ok":true,"result":{</text>
      <text x="600" y="288" fill="#a9b1d6">  "status":"ok",</text>
      <text x="600" y="304" fill="#a9b1d6">  "provider":"ollama",</text>
      <text x="600" y="320" fill="#a9b1d6">  "model":"llama3.2",</text>
      <text x="600" y="336" fill="#a9b1d6">  "tools":6,</text>
      <text x="600" y="352" fill="#a9b1d6">  "approval_required":["zig.build","terminal.write"]</text>
      <text x="600" y="368" fill="#a9b1d6">}}</text>
      <text x="600" y="396" fill="#cdd6f4">{"id":2,"method":"tools/call",</text>
      <text x="600" y="412" fill="#cdd6f4"> "tool":"rg.search","query":"theme"}</text>
      <text x="600" y="432" fill="#a9b1d6">{"id":2,"ok":true,"result":{</text>
      <text x="600" y="448" fill="#a9b1d6">  "status":0,</text>
      <text x="600" y="464" fill="#a9b1d6">  "stdout":"apps/desktop/src/theme.zig...",</text>
      <text x="600" y="480" fill="#a9b1d6">  "stdout_truncated":false,</text>
      <text x="600" y="496" fill="#a9b1d6">  "redacted":false</text>
      <text x="600" y="512" fill="#a9b1d6">}}</text>
      <text x="600" y="538" fill="#cdd6f4">❯</text>
    </g>
  </g>
  <text x="600" y="178" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#6c6f85" letter-spacing="0.4">PANE 3</text>

  <!-- Footer -->
  <text x="550" y="600" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6a7072">Each pane owns its own PTY · cwd · scrollback · status. Theme cycle propagates to all of them on the next prompt.</text>
</svg>
