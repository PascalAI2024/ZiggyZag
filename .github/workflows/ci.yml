name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build
      - run: zig build test
      - name: Smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\smoke.ps1
      - name: Smoke test
        if: runner.os != 'Windows'
        shell: sh
        run: sh ./scripts/smoke.sh
