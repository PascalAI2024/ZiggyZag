[package]
name = "ziggyzag-desktop"
version = "0.1.0"
description = "ZiggyZag desktop terminal host"
authors = ["PascalAI2024"]
edition = "2021"

[lib]
name = "ziggyzag_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

