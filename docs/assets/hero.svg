<svg width="1100" height="620" viewBox="0 0 1100 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ZiggyZag terminal hero</title>
  <desc id="desc">An animated terminal window showing ZiggyZag commands and cycling through themes.</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1100" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0C0E11"/>
      <stop offset="1" stop-color="#15181B"/>
    </linearGradient>
    <linearGradient id="hero-accent" x1="0" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7A41D"/>
      <stop offset="0.5" stop-color="#35D0BA"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="hero-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="14" in="SourceAlpha"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hero-clip">
      <rect x="60" y="120" width="980" height="440" rx="14"/>
    </clipPath>
  </defs>

  <rect width="1100" height="620" fill="url(#hero-bg)"/>
  <g opacity="0.06">
    <rect x="0" y="0" width="1100" height="1" fill="#9BE28F"/>
    <rect x="0" y="100" width="1100" height="1" fill="#9BE28F"/>
    <rect x="0" y="200" width="1100" height="1" fill="#9BE28F"/>
    <rect x="0" y="300" width="1100" height="1" fill="#9BE28F"/>
    <rect x="0" y="400" width="1100" height="1" fill="#9BE28F"/>
    <rect x="0" y="500" width="1100" height="1" fill="#9BE28F"/>
    <rect x="0" y="600" width="1100" height="1" fill="#9BE28F"/>
  </g>

  <rect x="60" y="120" width="980" height="440" rx="14" fill="#111315" stroke="#2B3447" stroke-width="1" filter="url(#hero-shadow)"/>
  <rect x="60" y="120" width="980" height="40" rx="14" fill="#191C1D"/>
  <rect x="60" y="148" width="980" height="12" fill="#191C1D"/>
  <circle cx="86" cy="140" r="6" fill="#FF6B6B"/>
  <circle cx="106" cy="140" r="6" fill="#FFD166"/>
  <circle cx="126" cy="140" r="6" fill="#35D0BA"/>
  <text x="540" y="145" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#6A7072">ziggyzag — ~/dev/ZiggyZag</text>

  <g clip-path="url(#hero-clip)">
    <g font-family="'Cascadia Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="16">
      <!-- Prompt 1 -->
      <text x="84" y="200" fill="#9BE28F">ziggy</text>
      <text x="142" y="200" fill="#7AB7FF">~/dev/ZiggyZag</text>
      <text x="290" y="200" fill="#CF9BFF">git:master</text>
      <text x="84" y="224" fill="#EEF2E2">❯ zig build &amp;&amp; ./zig-out/bin/ziggyzag<tspan opacity="0">
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.05;0.06" dur="6s" repeatCount="indefinite"/>
      </tspan></text>
      <text x="84" y="252" fill="#6A7072" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.12;0.13;1" dur="6s" repeatCount="indefinite"/>
        ziggyzag 0.1.0 · ziggy theme · prompt: dev
      </text>

      <!-- Prompt 2: prompt themes -->
      <text x="84" y="296" fill="#9BE28F" opacity="0">
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.2;0.21" dur="6s" repeatCount="indefinite"/>
        ziggy
      </text>
      <text x="142" y="296" fill="#7AB7FF" opacity="0">
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.2;0.21" dur="6s" repeatCount="indefinite"/>
        ~/dev/ZiggyZag
      </text>
      <text x="84" y="320" fill="#EEF2E2" opacity="0">
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.22;0.23" dur="6s" repeatCount="indefinite"/>
        ❯ prompt themes
      </text>
      <text x="84" y="348" fill="#EEF2E2" opacity="0">
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.3;0.31" dur="6s" repeatCount="indefinite"/>
        classic  smart  compact  <tspan fill="#9BE28F" font-weight="600">dev*</tspan>  dashboard
      </text>

      <!-- Prompt 3: theme cycle (this is the headline) -->
      <text x="84" y="392" fill="#9BE28F" opacity="0">
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.42;0.43" dur="6s" repeatCount="indefinite"/>
        ziggy
      </text>
      <text x="142" y="392" fill="#7AB7FF" opacity="0">
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.42;0.43" dur="6s" repeatCount="indefinite"/>
        ~/dev/ZiggyZag
      </text>
      <text x="84" y="416" fill="#EEF2E2" opacity="0">
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.45;0.46" dur="6s" repeatCount="indefinite"/>
        ❯ theme catppuccin-mocha
      </text>

      <!-- Theme swatch row -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0.6" keyTimes="0;0.52;0.55;0.85;1" dur="6s" repeatCount="indefinite"/>
        <rect x="84" y="448" width="40" height="40" rx="6" fill="#11131A"/>
        <rect x="132" y="448" width="40" height="40" rx="6" fill="#1E1E2E"/>
        <rect x="180" y="448" width="40" height="40" rx="6" fill="#1A1B26"/>
        <rect x="228" y="448" width="40" height="40" rx="6" fill="#282A36"/>
        <rect x="276" y="448" width="40" height="40" rx="6" fill="#2E3440"/>
        <rect x="324" y="448" width="40" height="40" rx="6" fill="#191724"/>
        <rect x="372" y="448" width="40" height="40" rx="6" fill="#282828"/>
        <rect x="420" y="448" width="40" height="40" rx="6" fill="#2B3339"/>
        <rect x="468" y="448" width="40" height="40" rx="6" fill="#1F1F28"/>
        <rect x="516" y="448" width="40" height="40" rx="6" fill="#002B36"/>
        <rect x="564" y="448" width="40" height="40" rx="6" fill="#282C34"/>
        <rect x="612" y="448" width="40" height="40" rx="6" fill="#F8F6EF"/>
        <rect x="660" y="448" width="40" height="40" rx="6" fill="#181310"/>
        <text x="84" y="510" fill="#6A7072" font-size="13">13 themes · one selection drives shell + desktop · Ctrl+Shift+T cycles</text>
      </g>

      <!-- Cursor -->
      <rect x="290" y="402" width="9" height="18" fill="#B6F09C">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Brand mark in corner -->
  <g transform="translate(60 36) scale(0.12)" opacity="0.95">
    <rect x="42" y="54" width="428" height="404" rx="38" fill="#191C1D" stroke="#2B3447" stroke-width="12"/>
    <path d="M138 180H354L228 296H366L366 336H150L276 220H138V180Z" fill="url(#hero-accent)"/>
  </g>
  <text x="120" y="80" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#EEF2E2" letter-spacing="-0.5">ZiggyZag</text>
  <text x="120" y="102" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#6A7072">A Zig shell workspace · MIT</text>
</svg>
